[package]
name = "dvbr"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = { version = "0.29", features = ["ioctl", "poll", "fs"] }
arib-b24 = { path = "../arib-b24-rs" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
bindgen = "0.71"
